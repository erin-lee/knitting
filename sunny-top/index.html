<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column; home = piece cards, piece = sticky bar, big counter, row card, chart, row list */
:root{
  --bg:#FFFCF4; --surface:#FFF4D6; --card:#FFFFFF; --ink:#2A2016; --muted:#7A6A55; --line:#ECDDBB;
  --accent:#E3A419; --accent-ink:#2A1C05; --shape:#B24E26; --shape-soft:#F8E1D4; --good:#4E7A3A;
  --chart-bg:#FFFFFF; --chart-ink:#6A5A44; --band:rgba(227,164,25,.42); --band-edge:#B24E26; --wash:rgba(255,244,214,.72);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#19140F; --surface:#241D15; --card:#2B231A; --ink:#F4EBD9; --muted:#AE9E84; --line:#3D3226;
  --accent:#F2B634; --accent-ink:#241703; --shape:#E4825A; --shape-soft:#3A2419; --good:#8DBB74;
  --chart-bg:#FFFCF4; --band:rgba(242,182,52,.45); --band-edge:#B24E26; --wash:rgba(36,29,21,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#19140F; --surface:#241D15; --card:#2B231A; --ink:#F4EBD9; --muted:#AE9E84; --line:#3D3226;
  --accent:#F2B634; --accent-ink:#241703; --shape:#E4825A; --shape-soft:#3A2419; --good:#8DBB74;
  --chart-bg:#FFFCF4; --band:rgba(242,182,52,.45); --band-edge:#B24E26; --wash:rgba(36,29,21,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--shape);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}

/* home */
.hero{padding-block:28px 8px;display:grid;gap:6px}
.hero h1{font-size:44px;line-height:1}
.hero .sub{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:16px 0;padding:14px 16px;background:var(--surface);border-radius:14px}
.facts div{min-width:0}
.facts b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.resume{width:100%;margin:16px 0 6px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:16px 18px;text-align:left;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.resume span:last-child{font-family:var(--f-mono);font-size:15px}
.group{margin-top:22px;display:grid;gap:10px}
.pcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;width:100%}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--chart-bg) center/cover no-repeat;border:1px solid var(--line)}
.pcard h2{font-size:20px}
.pcard .meta{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pcard .rowtxt{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}
.done-tag{color:var(--good);font-weight:700}
.sync{font-size:13px;color:var(--muted);margin-top:28px;text-align:center}

/* piece */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.topbar .back{border:0;background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.topbar .name{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .nav{border:0;background:transparent;font-size:24px;width:40px;height:40px;border-radius:10px}
.topbar .nav:disabled{opacity:.25}
.counter{display:grid;grid-template-columns:72px minmax(0,1fr) 112px;gap:12px;align-items:center;margin-top:16px}
.counter button{border-radius:22px;height:96px;font-size:40px;font-weight:600;border:0}
.minus{background:var(--surface)}
.plus{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -6px var(--accent)}
.plus:active{transform:scale(.97)}
.rowbig{text-align:center;min-width:0}
.rowbig .n{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1}
.rowbig .of{font-size:13px;color:var(--muted)}
.rowbig .side{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface)}
.instr{margin-top:16px;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line)}
.instr.shape{background:var(--shape-soft);border-color:var(--shape)}
.instr .lab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.instr .lab .eyebrow{color:var(--muted)}
.instr.shape .lab .eyebrow{color:var(--shape)}
.instr p{margin:8px 0 0;font-size:17px}
.instr .pat{margin-top:10px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.sts{font-family:var(--f-mono);font-weight:600;font-size:15px;white-space:nowrap}
.instr.shape .sts{color:var(--shape)}
.stsbig{display:block;font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--shape)}

.panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.zoom{display:flex;gap:6px}
.zoom button{width:38px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:18px}
.xax{position:relative;height:22px;overflow:hidden;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:var(--chart-bg)}
.xin{position:absolute;left:0;top:0;height:100%}
.xin span{position:absolute;top:0;transform:translateX(-50%);font:600 11px/21px var(--f-mono);color:var(--chart-ink);white-space:nowrap}
.xin i{position:absolute;bottom:0;width:1px;height:4px;background:var(--chart-ink);opacity:.5}
.chartbox{position:relative;height:340px;overflow:auto;border-radius:0 0 14px 14px;border:1px solid var(--line);background:var(--chart-bg);-webkit-overflow-scrolling:touch}
.chartin{position:relative;margin-top:26px}
.chartin img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.band{position:absolute;left:0;right:0;background:var(--band);border-top:2px solid var(--band-edge);border-bottom:2px solid var(--band-edge);pointer-events:none}
.wash{position:absolute;left:0;right:0;background:var(--wash);pointer-events:none}
.tag{position:absolute;transform:translateY(-120%);background:var(--band-edge);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend img{height:16px;background:#fff;border-radius:2px}
.note{font-size:13px;color:var(--muted);margin-top:6px}

.rows{margin-top:22px}
.rows ol{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.rows li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;width:100%;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.rows li:first-child button{border-top:0}
.rows li button:focus-visible{outline:3px solid var(--shape);outline-offset:-3px}
.rows .rn{font-family:var(--f-mono);font-weight:600}
.rows .rt{min-width:0}
.rows .shp .rn{color:var(--shape)}
.rows .past{opacity:.45}.rows .past .rt{text-decoration:line-through}
.rows .cur button{background:var(--accent);color:var(--accent-ink);position:sticky;top:0}
.reset{margin-top:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reset button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px}
.reset .danger{border-color:var(--shape);color:var(--shape);font-weight:700}

.checks{display:grid;gap:8px;margin-top:16px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px}
.checks input{width:22px;height:22px;accent-color:var(--shape);flex:none;margin-top:1px}
.checks small{display:block;color:var(--muted);font-size:13px}
@media (orientation:landscape) and (max-height:500px){.chartbox{height:58vh}.counter button{height:72px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>

function flatInfo(label, special){

  else if (label === 84) t = "Purl all sts.";
  else t = odd ? "Slip 1 knitwise with yarn in back, knit to end." : "Slip 1 purlwise with yarn in front, purl to end.";
  if (odd && label <= 83) { s = 34 - (label - 55); shape = true; }

  return {t, s, shape, side: odd ? "RS" : "WS"};
}

document.addEventListener("keydown",e=>{ if(!P||!location.hash.slice(1)||location.hash==="#finish") return; if(e.target.closest&&e.target.closest("input,textarea")) return;
  if(e.key==="+"||e.key==="="||e.key==="ArrowRight"){e.preventDefault();step(1);} else if(e.key==="-"||e.key==="ArrowLeft"){e.preventDefault();step(-1);} });
window.addEventListener("resize",()=>{ if(P&&$("#box")) layoutChart(); });

function render(scroll){
  const h=location.hash.slice(1); confirmReset=false;
  if(h==="finish"){P=null; finish();}
  else if(pieceById(h)){ piece(pieceById(h), scroll); }
  else { P=null; home(); }
}
window.addEventListener("hashchange",()=>{render(); window.scrollTo(0,0);});
render();
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
