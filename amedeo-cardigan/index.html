<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amedeo Cardigan — Row Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#120f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amedeo Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #120f1a;
  --bg2: #1b1626;
  --card: #221c30;
  --card-hi: #2a2239;
  --line: #362c49;
  --text: #f4f1fb;
  --text-dim: #b3a9c9;
  --pink: #ff2e93;
  --lime: #d6ff3f;
  --cyan: #38f0e0;
  --violet: #9b7bff;
  --danger: #ff5a5a;
  --radius: 22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); overscroll-behavior:none;}
body{
  font-family:'Manrope', sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,46,147,0.16), transparent 42%),
    radial-gradient(circle at 88% 15%, rgba(56,240,224,0.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(155,123,255,0.14), transparent 45%),
    var(--bg);
}
.hdisp{font-family:'Unbounded', sans-serif;}
button{font-family:inherit; cursor:pointer; color:inherit;}
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:24px;}

/* ---------- HOME ---------- */
.home-header{ padding: 28px 20px 10px; }
.home-eyebrow{ display:flex; align-items:center; justify-content:space-between; }
.home-title{ font-family:'Unbounded'; font-weight:900; font-size:30px; line-height:1.05; margin:6px 0 4px; letter-spacing:-0.01em;}
.home-title .dot{color:var(--lime);}
.home-sub{ color:var(--text-dim); font-size:14.5px; margin:0 0 6px; max-width:36ch;}
.help-btn{
  width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--card); color:var(--text); font-weight:800; font-size:16px;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.overall-bar-wrap{ margin: 14px 20px 6px; }
.overall-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.overall-track{ height:10px; border-radius:99px; background:var(--card); overflow:hidden; border:1px solid var(--line);}
.overall-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)); transition:width .4s ease;}

.card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding: 16px 20px 10px;}
.piece-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 14px 14px; text-align:left; color:var(--text); position:relative; overflow:hidden;
  min-height:150px; display:flex; flex-direction:column; justify-content:space-between;
  transition: transform .12s ease, border-color .12s ease;
}
.piece-card:active{ transform: scale(0.96); }
.piece-card .glow{
  position:absolute; inset:-40% -40% auto auto; width:110px; height:110px; border-radius:50%;
  filter:blur(30px); opacity:.55; pointer-events:none;
}
.piece-card .pname{ font-family:'Unbounded'; font-weight:700; font-size:15.5px; line-height:1.2; position:relative; z-index:1;}
.piece-card .pmeasure{ font-size:11px; color:var(--text-dim); font-weight:600; margin-top:3px; position:relative; z-index:1;}
.piece-card .pchip{
  align-self:flex-start; font-size:10.5px; font-weight:800; letter-spacing:.02em; padding:4px 9px;
  border-radius:99px; margin-top:8px; position:relative; z-index:1;
}
.chip-notstarted{ background:rgba(179,169,201,0.14); color:var(--text-dim); }
.chip-progress{ background:rgba(56,240,224,0.16); color:var(--cyan); }
.chip-done{ background:rgba(214,255,63,0.18); color:var(--lime); }
.piece-card .prow{ font-size:12.5px; color:var(--text-dim); margin-top:10px; position:relative; z-index:1; font-weight:600;}
.piece-card .prow b{ color:var(--text); font-weight:800; }
.mini-track{ height:6px; border-radius:99px; background:rgba(255,255,255,0.08); margin-top:8px; overflow:hidden; position:relative; z-index:1;}
.mini-fill{ height:100%; border-radius:99px; }

.finishing-card{
  margin: 6px 20px 30px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; display:flex; align-items:center; gap:14px; text-align:left; width:calc(100% - 40px);
  color:var(--text);
}
.finishing-icon{ width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg, var(--pink), var(--violet)); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;}
.finishing-text .pname{ font-family:'Unbounded'; font-weight:700; font-size:15px;}
.finishing-text .prow{ font-size:12.5px; color:var(--text-dim); margin-top:4px; font-weight:600;}

/* ---------- TRACKER ---------- */
.tracker{ display:flex; flex-direction:column; min-height:100vh; }
.tk-top{ display:flex; align-items:center; gap:10px; padding:18px 16px 6px; }
.back-btn{
  width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--card);
  color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; flex:none;
}
.tk-title{ font-family:'Unbounded'; font-weight:700; font-size:17px; flex:1; }
.tk-chip-group{ display:flex; align-items:center; gap:6px; flex:none; }
.tk-needle-chip{
  font-size:11px; font-weight:800; padding:5px 9px; border-radius:99px; background:rgba(255,159,67,0.16);
  color:#ff9f43; border:1px solid rgba(255,159,67,0.4); white-space:nowrap;
}
.tk-phase-chip{
  font-size:11px; font-weight:800; padding:5px 10px; border-radius:99px; background:var(--card-hi);
  color:var(--cyan); border:1px solid var(--line); white-space:nowrap;
}

.tk-measure{ padding: 2px 20px 0; font-size:12.5px; color:var(--text-dim); font-weight:600; }
.tk-progress-wrap{ padding: 6px 20px 0; }
.tk-progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.tk-track{ height:8px; border-radius:99px; background:var(--card); overflow:hidden; border:1px solid var(--line);}
.tk-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--pink), var(--cyan)); transition:width .35s ease;}

.milestone-banner{
  margin: 16px 20px 0; padding:12px 14px; border-radius:16px; font-weight:800; font-size:13.5px;
  display:flex; align-items:center; gap:10px; animation: pop .3s ease;
}
@keyframes pop{ from{ transform:scale(.92); opacity:0;} to{ transform:scale(1); opacity:1; } }
.ms-buttonhole{ background:rgba(255,46,147,0.18); color:var(--pink); border:1px solid rgba(255,46,147,0.4);}
.ms-vneck{ background:rgba(155,123,255,0.2); color:#c6b6ff; border:1px solid rgba(155,123,255,0.45);}
.ms-final{ background:rgba(214,255,63,0.2); color:var(--lime); border:1px solid rgba(214,255,63,0.45);}
.ms-increase{ background:rgba(56,240,224,0.18); color:var(--cyan); border:1px solid rgba(56,240,224,0.4);}
.ms-needle{ background:rgba(255,159,67,0.18); color:#ff9f43; border:1px solid rgba(255,159,67,0.45);}

.row-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 18px 24px 6px; text-align:center;}
.row-number{ font-family:'Unbounded'; font-weight:900; font-size:96px; line-height:0.9; letter-spacing:-0.02em;
  background:linear-gradient(135deg, var(--text) 40%, var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.row-total{ color:var(--text-dim); font-weight:700; font-size:15px; margin-top:6px;}
.row-side{ font-size:13px; color:var(--text-dim); margin-top:2px; font-weight:600;}
.row-instruction{
  margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px;
  font-size:15px; line-height:1.5; color:var(--text); text-align:left; max-width:420px;
}
.stitch-note{ margin-top:10px; font-size:12px; color:var(--text-dim); font-weight:700; text-align:left; width:100%; max-width:420px;}

.controls-bar{
  position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:16px 20px 10px;
  background:linear-gradient(0deg, var(--bg) 60%, transparent);
}
.minus-btn, .plus-btn{
  border:none; border-radius:20px; font-family:'Unbounded'; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.minus-btn{ width:64px; height:64px; background:var(--card-hi); color:var(--text); border:1.5px solid var(--line); font-size:26px; flex:none;}
.plus-btn{ flex:1; height:64px; font-size:20px; background:linear-gradient(135deg, var(--pink), var(--violet) 60%, var(--cyan)); color:#12061a; box-shadow: 0 8px 24px rgba(255,46,147,0.3);}
.plus-btn:active, .minus-btn:active{ transform:scale(.95); }
.plus-btn.done-state{ background:linear-gradient(135deg, var(--lime), var(--cyan)); }

.chart-panel{
  margin: 16px 20px 4px; background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:12px 12px 10px; max-width:420px; align-self:center; width:calc(100% - 40px);
}
.chart-panel-head{ display:flex; align-items:center; justify-content:space-between; padding:0 2px 9px; }
.chart-panel-title{ font-size:12px; font-weight:800; color:var(--text-dim); letter-spacing:.02em;}
.chart-panel-hint{ font-size:10.5px; font-weight:700; color:var(--cyan); }
.chart-img-wrap{ position:relative; border-radius:12px; overflow:hidden; background:#fff; line-height:0; }
.chart-img-wrap img{ width:100%; display:block; }
.chart-img-scroll{
  position:relative; border-radius:12px; overflow-x:auto; overflow-y:hidden; background:#fff;
  -webkit-overflow-scrolling:touch;
}
.chart-img-scroll .chart-img-inner{ position:relative; display:inline-block; line-height:0; height:220px; }
.chart-img-scroll img{ height:100%; width:auto; display:block; max-width:none; }
.chart-scroll-hint{ text-align:center; font-size:10.5px; color:var(--text-dim); font-weight:700; padding-top:6px; }
.chart-highlight{
  position:absolute; left:0; right:0; pointer-events:none;
  background:rgba(255,46,147,0.30); border-top:2.5px solid var(--pink); border-bottom:2.5px solid var(--pink);
}
.chart-highlight.secondary{ background:rgba(56,240,224,0.16); border-color:rgba(56,240,224,0.65); border-width:1.5px; }
.chart-center-marker{
  position:absolute; top:0; bottom:0; width:6px; pointer-events:none;
  background:#ffb020; opacity:0.3; z-index:2; transform:translateX(-50%);
}
.chart-center-label{
  position:absolute; top:-8px; transform:translateX(-50%); background:#ffb020; color:#1a1200;
  font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:99px; white-space:nowrap; z-index:2;
}
.half-toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:10px; }
.half-label-badge{
  font-size:11px; font-weight:800; padding:5px 10px; border-radius:99px; background:var(--card-hi);
  color:var(--text); border:1px solid var(--line);
}
.half-next-btn{
  flex:1; padding:11px 14px; border-radius:12px; border:none; font-family:'Unbounded'; font-weight:700;
  font-size:12.5px; background:linear-gradient(135deg, var(--pink), var(--violet)); color:#fff;
}
.half-back-link{ background:none; border:none; color:var(--text-dim); font-size:11.5px; font-weight:700; text-decoration:underline; padding:6px;}
.chart-panel-note{ padding:10px 4px 2px; font-size:12.5px; color:var(--text-dim); text-align:center; font-weight:600; }

.tk-footer{ display:flex; justify-content:center; padding: 6px 20px 26px; }
.row-jump-link{ background:none; border:none; color:var(--text-dim); font-size:12px; font-weight:700; text-decoration:underline; opacity:.75; padding:8px;}
/* Deliberately tiny + low contrast: destructive, so it should be hard to hit by accident. */
.reset-all-link{
  background:none; border:none; color:var(--text-dim); font-size:10.5px; font-weight:700;
  letter-spacing:.03em; opacity:.45; padding:4px 8px; text-decoration:underline;
}
.reset-all-link:active{ opacity:.8; }

/* ---------- CHART OVERLAY ---------- */
.chart-overlay{
  position:fixed; inset:0; background:rgba(6,4,10,0.97); z-index:100; touch-action:none;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.chart-overlay .zoom-wrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; touch-action:none;}
.chart-overlay .zoom-inner{ position:relative; display:inline-block; will-change:transform; box-shadow:0 10px 50px rgba(0,0,0,0.6); border-radius:4px; overflow:hidden; line-height:0;}
.chart-overlay img{ max-width:92vw; max-height:80vh; display:block; user-select:none; -webkit-user-drag:none; background:#fff;}
.chart-overlay .chart-highlight{ position:absolute; left:0; right:0; pointer-events:none;
  background:rgba(255,46,147,0.28); border-top:3px solid var(--pink); border-bottom:3px solid var(--pink);}
.chart-overlay .chart-highlight.secondary{ background:rgba(56,240,224,0.14); border-color:rgba(56,240,224,0.6); border-width:2px;}
.chart-close{
  position:fixed; top:18px; right:18px; width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line);
  background:var(--card); color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; z-index:102;
}
.chart-row-badge{
  position:fixed; top:18px; left:18px; z-index:102; background:linear-gradient(135deg, var(--pink), var(--violet));
  color:#fff; font-family:'Unbounded'; font-weight:800; padding:10px 16px; border-radius:14px; font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
}
.chart-row-badge span{ display:block; font-size:19px; margin-top:2px;}
.chart-hint{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:102; color:var(--text-dim);
  font-size:11.5px; font-weight:600; background:rgba(34,28,48,0.8); padding:6px 14px; border-radius:99px; border:1px solid var(--line);
}

/* ---------- MODALS ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(6,4,10,0.72); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{
  background:var(--bg2); border:1px solid var(--line); border-radius:24px 24px 0 0; padding:22px 22px 28px;
  width:100%; max-width:520px; animation: slideup .25s ease;
}
@keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal-title{ font-family:'Unbounded'; font-weight:800; font-size:18px; margin:0 0 10px;}
.modal-text{ font-size:14px; color:var(--text-dim); line-height:1.5; margin-bottom:18px;}
.modal-btn-row{ display:flex; gap:10px; }
.modal-btn{ flex:1; padding:14px; border-radius:14px; border:none; font-weight:800; font-size:14.5px; font-family:'Manrope';}
.modal-btn.cancel{ background:var(--card); color:var(--text); border:1.5px solid var(--line);}
.modal-btn.confirm{ background:var(--danger); color:#fff; }
.modal-btn.primary{ background:linear-gradient(135deg, var(--pink), var(--violet) 60%, var(--cyan)); color:#12061a; }
.modal-input{
  width:100%; box-sizing:border-box; margin-bottom:18px; padding:14px 16px; border-radius:14px;
  background:var(--card); border:1.5px solid var(--line); color:var(--text);
  font-family:'Unbounded'; font-weight:800; font-size:22px; text-align:center;
}
.modal-input:focus{ outline:none; border-color:var(--cyan); }

.info-modal .legend-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text); margin-bottom:10px; }
.info-modal .legend-sym{ width:28px; height:28px; border-radius:8px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; font-size:13px;}
.info-modal h4{ font-family:'Unbounded'; font-size:13px; margin:16px 0 8px; color:var(--cyan);}
.close-x{ position:absolute; top:18px; right:18px; width:36px; height:36px; border-radius:50%; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:16px;}

/* ---------- FINISHING SCREEN ---------- */
.finish-list{ padding: 8px 20px 20px; display:flex; flex-direction:column; gap:12px; }
.finish-item{
  display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:14px 16px; text-align:left; color:var(--text); width:100%;
}
.finish-check{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--violet); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:transparent;
}
.finish-check.checked{ background:linear-gradient(135deg, var(--lime), var(--cyan)); border-color:transparent; color:#12061a;}
.finish-item .ftext{ font-size:14.5px; line-height:1.4; color:var(--text); }
.finish-item.checked .ftext{ color:var(--text-dim); text-decoration:line-through; }

::-webkit-scrollbar{ display:none; }
</style>
</head>

<script>
/* ============ DATA MODEL ============ */

/* Body chart length, in chart rows (tracker rows 17 .. 16+BODY_CHART_ROWS).
   Cropped from the original 114 rows. */
const BODY_CHART_ROWS = 88;

function buildBodyPiece(cfg){
  const rows = [];
  let stitches = cfg.castOn;
  for(let r=1;r<=16;r++){
    const rs = r%2===1;
    let text = rs ? '1×1 rib: k1, p1 across the row, working edge stitches as set.' : '1×1 rib (WS): work each stitch as it appears (knit the knits, purl the purls).';
    let milestone=null, badge=null;
    if(r===1){
      text = `Cast on ${cfg.castOn} sts on 3.5 mm needles. ` + text;
      milestone='needle'; badge='3.5 mm needles';
    }
    if(cfg.buttonholeRib13 && r===13){
      text = 'Work in rib to the last 4 sts, then: k2tog (the 4th & 3rd-last sts), yo, k1, k1 edge st. Finish the row in rib as set.';
      milestone='buttonhole'; badge='Buttonhole row';
    }
    rows.push({n:r, phase:'rib', rs, chartRow:null, pos:null, stitches, text, milestone, badge});
  }
  for(let c=1;c<=BODY_CHART_ROWS;c++){
    const abs = 16+c;
    const rs = c%2===1;
    const pos = ((c-1)%10)+1;
    let text, milestone=null, badge=null;
    if(rs){
      text = `Chart ${cfg.chartLabel} — RS row, pattern row ${pos} of 10. Work the ajour chart as shown, edge stitches in stockinette.`;
    } else {
      text = 'WS row: purl across. Knit any yarn over instead of purling it \u2014 that makes the hole.';
    }
    if(c===1){
      text = 'Change to 5 mm needles. ' + text;
      milestone='needle'; badge='5 mm needles';
    }
    if(cfg.buttonholeChartRows && cfg.buttonholeChartRows.includes(c)){
      text += ' BUTTONHOLE ROW: work to the last 4 sts, k2tog (4th & 3rd-last sts), yo, k1, k1 edge st.';
      milestone='buttonhole'; badge='Buttonhole row';
    }
    if(cfg.vneckStart && c===cfg.vneckStart){
      milestone='vneck'; badge='V-neck starts';
      text += ' V-NECK SHAPING BEGINS — decrease on this row and every RS row from here to the end.';
    }
    let willDecrease=false;
    if(cfg.vneckStart && rs && c>=cfg.vneckStart && c<BODY_CHART_ROWS){
      willDecrease = true;
      if(cfg.decreaseType==='right') text += ' Decrease: k2tog over the last 2 sts before the button-band ribbing.';
      if(cfg.decreaseType==='left') text += ' Decrease: work 6 sts in rib, then sl 1 knitwise, k1, pass slipped st over.';
    }
    rows.push({n:abs, phase:'chart', rs, chartRow:c, pos, stitches, text, milestone, badge});
    if(willDecrease) stitches -= 1;
    if(c===BODY_CHART_ROWS && !cfg.extraFinalRow){
      rows[rows.length-1].text += ` Cast off all remaining ${stitches} sts — piece complete!`;
      rows[rows.length-1].milestone='final'; rows[rows.length-1].badge='Final row';
    }
  }
  if(cfg.extraFinalRow){
    rows.push({n:16+BODY_CHART_ROWS+1, phase:'castoff', rs:null, chartRow:null, pos:null, stitches,
      text:`Cast off all ${stitches} sts. Piece complete!`, milestone:'final', badge:'Final row'});
  }
  return rows;
}

function buildSleeve(){
  const rows = [];
  for(let r=1;r<=26;r++){
    const rs = r%2===1;
    let text = rs ? '1×1 rib: k1, p1 across.' : '1×1 rib (WS): work each stitch as it appears.';
    let milestone=null, badge=null;
    if(r===1){
      text = 'Cast on 37 sts on 3.5 mm needles. ' + text;
      milestone='needle'; badge='3.5 mm needles';
    }
    rows.push({n:r, phase:'rib', rs, chartRow:null, pos:null, stitches:37, text, milestone, badge});
  }
  rows.push({n:27, phase:'increase', rs:true, chartRow:null, pos:null, stitches:37,
    text:'Change to 5 mm needles. Knit 4, then *m1, k1* to the last 4 sts, knit the last 4 sts. → 67 sts on the needle.',
    milestone:'increase', badge:'Increase row'});
  rows.push({n:28, phase:'setup', rs:false, chartRow:null, pos:null, stitches:67,
    text:'Purl this WS row.', milestone:null, badge:null});
  for(let c=1;c<=87;c++){
    const abs = 28+c;
    const rs = c%2===1;
    const pos = ((c-1)%10)+1;
    let text = rs ? `Chart D — RS row, pattern row ${pos} of 10. Work the ajour chart as shown.` : 'WS row: purl across. Knit any yarn over instead of purling it.';
    let milestone=null, badge=null;
    if(c===87){ text += ' Cast off all 67 sts — sleeve complete!'; milestone='final'; badge='Final row'; }
    rows.push({n:abs, phase:'chart', rs, chartRow:c, pos, stitches:67, text, milestone, badge});
  }
  return rows;
}

function cmToIn(cm){ return Math.round((cm/2.54)*10)/10; }
function measurementText(pc){
  return `${pc.wCm} × ${pc.lCm} cm (${cmToIn(pc.wCm)} × ${cmToIn(pc.lCm)} in)`;
}

const FINISH_TASKS = [
  'Wet block all five pieces — stretch to measurements and let dry.',
  'Sew the shoulder seams.',
  'Sew the side seams (size XS: sew up to row 42).',
  'Sew the sleeve seams, then attach both sleeves to the back and front parts.',
  'Sew the 3 buttons onto the left front part.',
];

const CARD_ACCENTS = {
  back:'var(--pink)', rightFront:'var(--cyan)', leftFront:'var(--violet)', sleeve1:'var(--lime)', sleeve2:'#ff9f43'
};

const CHART_META = {
  back:        { letter:'A', halves:['right','left'], imgs:{right:CHART_A_RIGHT, left:CHART_A_LEFT}, primaryHalf:'right', scrollMode:false, split:true },
  rightFront:  { letter:'B', halves:['main'],          img:CHART_B, primaryHalf:'main', scrollMode:false },
  leftFront:   { letter:'C', halves:['main'],          img:CHART_C, primaryHalf:'main', scrollMode:false },
  sleeve1:     { letter:'D', halves:['main'],          img:CHART_D_WIDE, primaryHalf:'main', scrollMode:true },
  sleeve2:     { letter:'D', halves:['main'],          img:CHART_D_WIDE, primaryHalf:'main', scrollMode:true },
};

/* Fraction lookup table, keyed the same way for every chart:
   CHART_FRACS[letter][half][label] = [top, bottom] as a fraction of image height.
   Back's right/left halves are now independent standalone images, each with
   their own fraction table (not the old stacked-combined-image version). */
const FRACS_BY_LETTER = Object.assign({}, CHART_FRACS, {
  D: CHART_D_WIDE_FRACS,
  A: { right: CHART_A_RIGHT_FRACS.main, left: CHART_A_LEFT_FRACS.main }
});

/* Given a row object, return the chart-image label (1,3,...,23) currently
   "active" — the RS row itself, or (on a WS row) the RS row it belongs to. */
function activeChartLabel(rowObj){
  if(!rowObj || rowObj.phase !== 'chart') return null;
  return rowObj.rs ? rowObj.pos : rowObj.pos - 1;
}

/* Build the list of highlight regions {half, top, bottom, primary} for a piece + label.
   Includes the primary occurrence plus fainter "echo" occurrences 10 and 20 rows on
   (label+10, label+20) since the motif repeats identically. */
function highlightRegions(pieceKey, label){
  const meta = CHART_META[pieceKey];
  if(!meta || label==null) return [];
  const table = FRACS_BY_LETTER[meta.letter];
  const labels = [label, label+10, label+20].filter(l => l <= 23);
  const regions = [];
  meta.halves.forEach(half=>{
    labels.forEach((l,i)=>{
      const entry = table[half] && table[half][l];
      if(entry){
        regions.push({ half, top:entry[0], bottom:entry[1], primary: i===0 });
      }
    });
  });
  return regions;
}

function renderHighlightDivs(regions, half){
  return regions.filter(r=>r.half===half).map(r=>{
    const topPct = (r.top*100).toFixed(2);
    const hPct = ((r.bottom-r.top)*100).toFixed(2);
    const cls = r.primary ? '' : 'secondary';
    return `<div class="chart-highlight ${cls}" style="top:${topPct}%; height:${hPct}%"></div>`;
  }).join('');
}

/* ============ STATE + STORAGE ============ */

/* Persistence layer. Prefers a host-provided `window.storage` (async key/value
   API) when one exists, and otherwise falls back to localStorage so progress
   survives reloads in a plain browser / installed PWA. */
const store = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      return await window.storage.get(key, false);
    }
    try{
      const value = localStorage.getItem(key);
      return value === null ? null : { value };
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      return await window.storage.set(key, value, false);
    }
    try{ localStorage.setItem(key, value); }
    catch(e){ /* storage unavailable (private mode, quota); continue in memory */ }
  }
};

let progress = null;
let screen = 'home';
let activePieceKey = null;
let chartOpen = false;
let modal = null; // 'info' | {type:'resetAll'} | {type:'setRow', pieceKey}

function defaultProgress(){
  const p = {};
  PIECES.forEach(pc => p[pc.key] = { row: 1 });
  p.back.half = 'right';
  p.finishing = { done: [false,false,false,false,false] };
  return p;
}

async function loadProgress(){
  try{
    const res = await store.get('amedeo-progress');
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      progress = Object.assign(defaultProgress(), parsed);
      PIECES.forEach(pc => { if(!progress[pc.key]) progress[pc.key] = {row:1}; });
      if(!progress.back.half) progress.back.half = 'right';
      if(!progress.finishing) progress.finishing = { done:[false,false,false,false,false] };
    } else {
      progress = defaultProgress();
    }
  } catch(e){
    progress = defaultProgress();
  }
}

async function saveProgress(){
  try{ await store.set('amedeo-progress', JSON.stringify(progress)); }
  catch(e){ /* best effort */ }
}

/* ============ HELPERS ============ */

function pieceByKey(key){ return PIECES.find(p => p.key === key); }

function statusFor(pieceKey){
  const pc = pieceByKey(pieceKey);
  const row = progress[pieceKey].row;
  const total = pc.rows.length;
  if(row <= 1) return 'notstarted';
  if(row > total) return 'done';
  return 'progress';
}

function phaseLabel(rowObj){
  if(!rowObj) return '';
  if(rowObj.phase==='rib') return '1×1 Rib';
  if(rowObj.phase==='increase') return 'Increase row';
  if(rowObj.phase==='setup') return 'Setup row';
  if(rowObj.phase==='castoff') return 'Cast off';
  if(rowObj.phase==='chart') return (rowObj.rs ? 'Chart · RS' : 'Chart · WS');
  return '';
}

function needleSize(rowObj){
  if(!rowObj) return '';
  return rowObj.phase==='rib' ? '3.5 mm' : '5 mm';
}

function esc(s){ return s; }

/* ============ RENDER: HOME ============ */

function renderHome(){

  const doneRows = PIECES.reduce((a,p)=>a+Math.min(progress[p.key].row-1, p.rows.length), 0);
  const overallPct = Math.round((doneRows/totalRows)*100);

  const cards = PIECES.map(pc => {
    const row = Math.min(progress[pc.key].row, pc.rows.length);
    const st = statusFor(pc.key);
    const pct = Math.round((Math.min(progress[pc.key].row-1, pc.rows.length)/pc.rows.length)*100);
    const chipClass = st==='notstarted' ? 'chip-notstarted' : st==='done' ? 'chip-done' : 'chip-progress';
    const chipText = st==='notstarted' ? 'Not started' : st==='done' ? 'Complete' : 'In progress';
    const accent = CARD_ACCENTS[pc.key];

      <div class="pchip ${chipClass}">${chipText}</div>

        <div class="prow">Row <b>${st==='done'?pc.rows.length:row}</b> / ${pc.rows.length}</div>

      </div>
    </button>`;
  }).join('');

  const finDone = progress.finishing.done.filter(Boolean).length;

  document.getElementById('app').innerHTML = `
    <div class="home-header">
      <div class="home-eyebrow">
        <div>
          <div class="home-title">Amedeo<span class="dot">.</span></div>
        </div>
        <button class="help-btn" id="openInfo">?</button>
      </div>
      <p class="home-sub">Size XS · your five-piece cardigan, tracked row by row.</p>
    </div>
    <div class="overall-bar-wrap">
      <div class="overall-label"><span>Overall progress</span><span>${overallPct}%</span></div>
      <div class="overall-track"><div class="overall-fill" style="width:${overallPct}%"></div></div>
    </div>
    <div class="card-grid">${cards}</div>
    <button class="finishing-card" id="openFinishing">
      <div class="finishing-icon">✂️</div>
      <div class="finishing-text">
        <div class="pname">Finishing</div>
        <div class="prow">${finDone} / 5 steps done</div>
      </div>
    </button>
  `;

  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activePieceKey = btn.getAttribute('data-open'); screen='tracker'; render(); });
  });
  document.getElementById('openFinishing').addEventListener('click', ()=>{ screen='finishing'; render(); });
  document.getElementById('openInfo').addEventListener('click', ()=>{ modal='info'; render(); });

/* ============ RENDER: TRACKER ============ */

function renderTracker(){
  const pc = pieceByKey(activePieceKey);
  const total = pc.rows.length;
  let rowIdx = progress[activePieceKey].row;
  const isDone = rowIdx > total;
  const clampedIdx = Math.min(rowIdx, total);
  const rowObj = pc.rows[clampedIdx-1];
  const pct = Math.round((Math.min(rowIdx-1,total)/total)*100);

  let banner = '';
  if(!isDone && rowObj.milestone){
    const icons = { buttonhole:'🕳️', vneck:'✂️', final:'🏁', increase:'✨', needle:'🪡' };
    banner = `<div class="milestone-banner ms-${rowObj.milestone}"><span>${icons[rowObj.milestone]}</span><span>${rowObj.badge}</span></div>`;
  }
  if(isDone){
    banner = `<div class="milestone-banner ms-final"><span>🎉</span><span>${pc.name} complete!</span></div>`;
  }

  const meta = CHART_META[activePieceKey];
  const label = isDone ? null : activeChartLabel(rowObj);
  const regions = label!=null ? highlightRegions(activePieceKey, label) : [];

  let chartHalvesHtml, scrollHint, halfToggleHtml = '';
  if(meta.split){
    const half = progress.back.half || 'right';
    const img = meta.imgs[half];
    const markerFrac = STITCH40_FRAC[half];
    const showMarker = !isDone && rowObj.phase === 'chart';
    const markerHtml = showMarker ? `
      <div class="chart-center-marker" style="left:${(markerFrac*100).toFixed(2)}%"></div>
      <div class="chart-center-label" style="left:${(markerFrac*100).toFixed(2)}%">st 40</div>
    ` : '';
    chartHalvesHtml = `
      <div class="chart-img-wrap" data-half="${half}">
        <img src="${img}" alt="Chart A ${half} half">
        ${renderHighlightDivs(regions, half)}
        ${markerHtml}
      </div>
    `;
    scrollHint = '';
    if(!isDone && rowObj.phase === 'chart'){
      const halfLabel = half === 'right' ? 'Right half' : 'Left half';
      const control = rowObj.rs
        ? (half === 'right'
            ? `<button class="half-next-btn" id="halfToggleBtn">Reached the middle →</button>`
            : `<button class="half-back-link" id="halfToggleBtn">◂ Back to right half</button>`)
        : '';
      halfToggleHtml = `<div class="half-toggle-row"><span class="half-label-badge">${halfLabel}</span>${control}</div>`;
    }
  } else {
    chartHalvesHtml = meta.scrollMode
      ? meta.halves.map(half => `
          <div class="chart-img-scroll" data-half="${half}">
            <div class="chart-img-inner">
              <img src="${meta.img}" alt="Chart ${meta.letter} ${half}">
              ${renderHighlightDivs(regions, half)}
            </div>
          </div>
        `).join('')
      : meta.halves.map(half => `
          <div class="chart-img-wrap" data-half="${half}">
            <img src="${meta.img}" alt="Chart ${meta.letter} ${half}">
            ${renderHighlightDivs(regions, half)}
          </div>
        `).join('<div style="height:10px"></div>');
    scrollHint = meta.scrollMode ? `<div class="chart-scroll-hint">Scroll sideways to see the full row ⟷</div>` : '';
  }

  let panelNote = '';
  if(!isDone && rowObj.phase !== 'chart'){
    panelNote = rowObj.phase==='rib' ? 'Rib section — the chart starts once you switch needles.'
              : rowObj.phase==='increase' ? 'Increase row — chart starts next row.'
              : rowObj.phase==='setup' ? 'One more purl row, then the chart begins.'
              : 'Cast off — chart complete.';
  }

  document.getElementById('app').innerHTML = `
  <div class="tracker">
    <div class="tk-top">
      <button class="back-btn" id="goHome">←</button>
      <div class="tk-title">${pc.name}</div>
      <div class="tk-chip-group">
        ${!isDone ? `<div class="tk-needle-chip">${needleSize(rowObj)}</div>` : ''}
        <div class="tk-phase-chip">${isDone ? 'Done' : phaseLabel(rowObj)}</div>
      </div>
    </div>
    <div class="tk-measure">Finished size: ${measurementText(pc)}</div>
    <div class="tk-progress-wrap">
      <div class="tk-progress-label"><span>Row ${isDone?total:clampedIdx} of ${total}</span><span>${pct}%</span></div>
      <div class="tk-track"><div class="tk-fill" style="width:${pct}%"></div></div>
    </div>
    ${banner}
    <div class="row-stage">
      <div class="row-number">${isDone ? '✓' : clampedIdx}</div>
      <div class="row-total">${isDone ? 'All rows complete' : 'of ' + total + ' rows'}</div>
      ${(!isDone) ? `<div class="row-side">${rowObj.stitches} sts on the needle</div>` : ''}
      <div class="row-instruction">${isDone ? 'Weave in ends, then head to the Finishing checklist from the home screen when all pieces are done.' : rowObj.text}</div>
    </div>
    ${!isDone ? `
    <div class="chart-panel" id="chartPanel">
      <div class="chart-panel-head">
        <div class="chart-panel-title">Chart ${meta.letter}${label!=null ? ' · row '+label : ''}</div>
        <div class="chart-panel-hint">Tap to zoom ⤢</div>
      </div>
      ${chartHalvesHtml}
      ${scrollHint}
      ${halfToggleHtml}
      ${panelNote ? `<div class="chart-panel-note">${panelNote}</div>` : ''}
    </div>` : ''}
    <div class="controls-bar">
      <button class="minus-btn" id="minusBtn">−</button>
      <button class="plus-btn ${isDone?'done-state':''}" id="plusBtn">${isDone ? 'Piece complete 🎉' : 'Row done — next row'}</button>
    </div>
    <div class="tk-footer"><button class="row-jump-link" id="setRowBtn">Jump to a row</button></div>
  </div>
  `;

  document.getElementById('goHome').addEventListener('click', ()=>{ screen='home'; render(); });
  const chartPanel = document.getElementById('chartPanel');
  if(chartPanel) chartPanel.addEventListener('click', ()=>{ chartOpen=true; render(); });
  const halfToggleBtn = document.getElementById('halfToggleBtn');
  if(halfToggleBtn){
    halfToggleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      progress.back.half = progress.back.half === 'right' ? 'left' : 'right';
      saveProgress();
      render();
    });
  }
  document.getElementById('setRowBtn').addEventListener('click', ()=>{ modal = {type:'setRow', pieceKey:activePieceKey}; render(); });
  document.getElementById('plusBtn').addEventListener('click', ()=>{
    if(progress[activePieceKey].row <= total){
      progress[activePieceKey].row += 1;
      if(activePieceKey === 'back') progress.back.half = 'right';
      saveProgress();
      render();
    }
  });
  document.getElementById('minusBtn').addEventListener('click', ()=>{
    if(progress[activePieceKey].row > 1){
      progress[activePieceKey].row -= 1;
      if(activePieceKey === 'back') progress.back.half = 'right';
      saveProgress();
      render();
    }
  });
}

/* ============ CHART OVERLAY (pan/zoom) ============ */

let zoomState = { scale:1, x:0, y:0 };
let pointers = new Map();
let lastDist = null;
let lastMid = null;
let dragStart = null;

function renderChartOverlay(){
  const pc = pieceByKey(activePieceKey);
  const meta = CHART_META[activePieceKey];
  const rowIdx = Math.min(progress[activePieceKey].row, pc.rows.length);
  const rowObj = pc.rows[rowIdx-1];
  const label = activeChartLabel(rowObj);
  const regions = label!=null ? highlightRegions(activePieceKey, label) : [];
  const currentHalf = meta.split ? (progress.back.half || 'right') : meta.primaryHalf;
  const overlayImg = meta.split ? meta.imgs[currentHalf] : meta.img;
  const primaryRegion = regions.find(r=>r.half===currentHalf && r.primary) || regions.find(r=>r.primary);
  const markerFrac = meta.split ? STITCH40_FRAC[currentHalf] : null;
  const markerHtml = (meta.split && rowObj.phase==='chart') ? `
    <div class="chart-center-marker" style="left:${(markerFrac*100).toFixed(2)}%"></div>
    <div class="chart-center-label" style="left:${(markerFrac*100).toFixed(2)}%">st 40</div>
  ` : '';

  const overlay = document.createElement('div');
  overlay.className = 'chart-overlay';
  overlay.id = 'chartOverlay';
  overlay.innerHTML = `
    <div class="zoom-wrap" id="zoomWrap">
      <div class="zoom-inner" id="zoomInner">
        <img id="chartImg" src="${overlayImg}" alt="Chart ${meta.letter}" draggable="false">
        ${renderHighlightDivs(regions, currentHalf)}
        ${markerHtml}
      </div>
    </div>
    <button class="chart-close" id="chartClose">✕</button>
    <div class="chart-row-badge">Row<span>${rowIdx}</span></div>
    <div class="chart-hint">Pinch or scroll to zoom · drag to pan · double-tap to reset</div>
  `;
  document.body.appendChild(overlay);

  const img = document.getElementById('chartImg');
  const inner = document.getElementById('zoomInner');
  zoomState = { scale:1, x:0, y:0 };

  function centerOnHighlight(){
    const H = img.clientHeight;
    const targetScale = 2.2;
    let ty = 0;
    if(primaryRegion){
      const centerFrac = (primaryRegion.top + primaryRegion.bottom) / 2;
      ty = targetScale * H * (0.5 - centerFrac);
    }
    zoomState = { scale: targetScale, x: 0, y: ty };
    applyTransform();
  }

  if(img.complete) centerOnHighlight();
  else img.addEventListener('load', centerOnHighlight, {once:true});

  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay){ closeChart(); }
  });
  document.getElementById('chartClose').addEventListener('click', closeChart);

  inner.addEventListener('pointerdown', (e)=>{
    inner.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      dragStart = { x:e.clientX - zoomState.x, y:e.clientY - zoomState.y };
    } else if(pointers.size === 2){
      const pts = Array.from(pointers.values());
      lastDist = dist(pts[0], pts[1]);
      lastMid = mid(pts[0], pts[1]);
    }
  });
  inner.addEventListener('pointermove', (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1 && dragStart){
      zoomState.x = e.clientX - dragStart.x;
      zoomState.y = e.clientY - dragStart.y;
      applyTransform();
    } else if(pointers.size === 2){
      const pts = Array.from(pointers.values());
      const d = dist(pts[0], pts[1]);
      if(lastDist){
        const ratio = d / lastDist;
        zoomState.scale = Math.min(6, Math.max(1, zoomState.scale * ratio));
      }
      lastDist = d;
      applyTransform();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2){ lastDist = null; }
    if(pointers.size === 0){ dragStart = null; }
  }
  inner.addEventListener('pointerup', endPointer);
  inner.addEventListener('pointercancel', endPointer);
  inner.addEventListener('pointerleave', endPointer);

  inner.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoomState.scale = Math.min(6, Math.max(1, zoomState.scale * delta));
    applyTransform();
  }, {passive:false});

  inner.addEventListener('dblclick', centerOnHighlight);

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  function applyTransform(){
    inner.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
  }
}

function closeChart(){
  const el = document.getElementById('chartOverlay');
  if(el) el.remove();
  pointers.clear(); lastDist=null; dragStart=null;
  chartOpen = false;
}

/* ============ MODALS ============ */

function renderModal(){
  let existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
  if(!modal) return;

  const root = document.createElement('div');
  root.id = 'modalRoot';
  root.className = 'modal-backdrop';

  if(modal === 'info'){
    root.innerHTML = `
      <div class="modal-sheet info-modal" style="position:relative;">
        <button class="close-x" id="closeInfo">✕</button>
        <div class="modal-title">How to read the charts</div>
        <div class="modal-text">Charts show RS rows only. Purl every WS row — except a yarn over, which you knit to open the hole. If a row starts or ends with a yarn over, skip it and knit 4 sts instead.</div>
        <h4>Symbols</h4>
        <div class="legend-row"><div class="legend-sym">◤</div> Knit 2 together</div>
        <div class="legend-row"><div class="legend-sym">O</div> Yarn over (1 hole)</div>
        <div class="legend-row"><div class="legend-sym">◥</div> Slip 1, k1, pass slipped st over</div>
        <div class="legend-row"><div class="legend-sym">–</div> 1 purl</div>
        <div class="legend-row"><div class="legend-sym">e</div> Edge stitch</div>
        <h4>Pattern repeat</h4>
        <div class="modal-text">Each chart repeats every 10 rows (5 RS + 5 WS). The tracker labels each RS row "pattern row X of 10" so you can match it to the chart image, which shows a couple of repeats stacked for clarity.</div>
      </div>`;
    root.addEventListener('click', (e)=>{ if(e.target===root){ modal=null; render(); } });
    document.body.appendChild(root);
    document.getElementById('closeInfo').addEventListener('click', ()=>{ modal=null; render(); });
    return;
  }

  if(modal.type === 'setRow'){
    const pc = pieceByKey(modal.pieceKey);
    const total = pc.rows.length;
    const current = Math.min(progress[modal.pieceKey].row, total);
    root.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-title">Which row are you on?</div>
        <div class="modal-text">Enter the row of ${pc.name} you're about to knit — handy if you started this piece away from the tracker. 1–${total}.</div>
        <input class="modal-input" id="rowInput" type="number" inputmode="numeric" min="1" max="${total}" value="${current}">
        <div class="modal-btn-row">
          <button class="modal-btn cancel" id="cancelSetRow">Cancel</button>
          <button class="modal-btn primary" id="confirmSetRow">Go to row</button>
        </div>
      </div>`;
    document.body.appendChild(root);

    const input = document.getElementById('rowInput');
    input.focus();
    input.select();

    const applyRow = ()=>{
      const parsed = parseInt(input.value, 10);
      if(!isNaN(parsed)){
        progress[modal.pieceKey].row = Math.min(Math.max(parsed, 1), total);
        if(modal.pieceKey === 'back') progress.back.half = 'right';
        saveProgress();
      }
      modal=null; render();
    };

    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') applyRow(); });
    document.getElementById('cancelSetRow').addEventListener('click', ()=>{ modal=null; render(); });
    document.getElementById('confirmSetRow').addEventListener('click', applyRow);
    return;
  }

  if(modal.type === 'resetAll'){
    root.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-title">Reset everything?</div>
        <div class="modal-text">This sets all five pieces back to row 1 and unchecks all 5 finishing steps. This can't be undone.</div>
        <div class="modal-btn-row">
          <button class="modal-btn cancel" id="cancelResetAll">Cancel</button>
          <button class="modal-btn confirm" id="confirmResetAll">Reset everything</button>
        </div>
      </div>`;
    document.body.appendChild(root);
    document.getElementById('cancelResetAll').addEventListener('click', ()=>{ modal=null; render(); });
    document.getElementById('confirmResetAll').addEventListener('click', ()=>{
      progress = defaultProgress();
      saveProgress();
      modal=null; render();
    });
    return;
  }
}

/* ============ MAIN RENDER ============ */

function render(){
  if(screen==='home') renderHome();
  else if(screen==='tracker') renderTracker();
  else if(screen==='finishing') renderFinishing();

  const existingOverlay = document.getElementById('chartOverlay');
  if(chartOpen && !existingOverlay){ renderChartOverlay(); }
  if(!chartOpen && existingOverlay){ existingOverlay.remove(); }

  renderModal();
}

(async function init(){
  await loadProgress();
  render();
})();
</script>
