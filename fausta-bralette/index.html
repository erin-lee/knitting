<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fausta Bralette — Row Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f7f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fausta Tracker">
<style>:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } html, body { margin: 0; } [hidden] { display: none !important; }</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one continuous phone page; sticky progress header, big counter + current-row card, then every row of the bralette in order under section headings */
:root{
  --bg:#f7f3f5; --surface:#fffdfe; --ink:#2b1a24; --muted:#7a6571; --line:#e6dbe1;
  --plum:#5b2142; --plum-ink:#ffffff; --plum-soft:#efdfe8;
  --shape:#a8742b; --shape-soft:#f6ead7;
  --done:#c9b8c2; --ok:#4f9a6a;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1217; --surface:#241a20; --ink:#f3e8ee; --muted:#ad97a4; --line:#3a2c34;
  --plum:#d68fb6; --plum-ink:#2a0f1f; --plum-soft:#3d2533;
  --shape:#e3b46a; --shape-soft:#3a2d1b; --done:#5a4652; --ok:#7cc495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1217; --surface:#241a20; --ink:#f3e8ee; --muted:#ad97a4; --line:#3a2c34;
  --plum:#d68fb6; --plum-ink:#2a0f1f; --plum-soft:#3d2533;
  --shape:#e3b46a; --shape-soft:#3a2d1b; --done:#5a4652; --ok:#7cc495; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* sticky header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.head h1{font-size:20px;line-height:1.1}
.head .sec{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .pct{font-family:var(--mono);font-size:13px;color:var(--plum);font-weight:600;text-align:right}
.head .bar{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--plum-soft);overflow:hidden}
.head .bar span{display:block;height:100%;background:var(--plum);transition:width .2s}
.schem{width:46px;height:auto;display:block}
.schem .z{fill:var(--plum-soft);stroke:var(--bg);stroke-width:2}
.schem .z.full{fill:var(--done)}
.schem .z.on{fill:var(--plum)}

/* counter */
.counter{display:grid;grid-template-columns:72px 1fr 112px;gap:12px;align-items:center;margin-top:18px}
.minus{height:72px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:32px;color:var(--muted)}
.plus{height:112px;border-radius:26px;border:0;background:var(--plum);color:var(--plum-ink);font-size:52px;font-weight:500;box-shadow:0 8px 22px -10px var(--plum)}
.plus:active,.minus:active{transform:scale(.97)}
.plus:disabled,.minus:disabled{opacity:.35}
.readout{text-align:center;min-width:0}
.readout .n{font-family:var(--mono);font-weight:600;font-size:52px;line-height:1;color:var(--plum)}
.readout .of{font-family:var(--mono);color:var(--muted);font-size:14px;margin-top:4px}
.readout .side{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--plum-soft);color:var(--plum)}
.now{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.now.shape{background:var(--shape-soft);border-color:var(--shape)}
.now.shape .eyebrow{color:var(--shape)}
.now p{margin:6px 0 0;font-size:17px;line-height:1.5}
.now .sts{margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.now .sts b{color:var(--ink);font-size:18px}
.tgt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.tgt .ctl{display:flex;align-items:center;gap:6px}
.tgt button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.tgt .mono{color:var(--ink);font-weight:600;min-width:3ch;text-align:center}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.meta b{color:var(--ink);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--done);display:inline-block}
.sync.ok i{background:var(--ok)}

/* full row list */
.list{margin-top:24px}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sect h2{font-size:20px}
.sect .mono{font-size:12px;color:var(--muted);white-space:nowrap}
.sect.done h2{color:var(--muted)}
.row{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:baseline;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:14px}
.row .rn{font-family:var(--mono);color:var(--muted);grid-row:1 / span 2}
.row .rs{grid-column:2;font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .rs:empty{display:none}
.row.shape .rn{color:var(--shape);font-weight:600}
.row.past{opacity:.5}
.row.past .rt{text-decoration:line-through;text-decoration-color:var(--done)}
.row.cur{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);bottom:8px;z-index:2;background:var(--plum);color:var(--plum-ink);opacity:1}
.row.cur .rn,.row.cur .rs{color:var(--plum-ink)}
.row.cur .rt{text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:28px;font-size:14px;align-items:center}
.foot button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
.foot .danger{border-color:var(--shape);color:var(--shape)}
.credit{font-size:12px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const SLUG="fausta-1a", LS="pt-"+SLUG+"-page", RPC=3.6; // 36 rounds = 10 cm in 2x2 rib
const DEC="Work to 1st marker, sm, ssk improved, work to 2 sts before 2nd marker, k2tog, sm, work to end of round.";
const PLAIN="Work every st as it presents itself. Three knits in a row at the decrease spots is expected.";
const RSDEC="sl1, work to 1st marker, sm, ssk improved, work to 2 sts before 2nd marker, k2tog, sm, work until 1 st is left, k1, turn.";
const WSPLAIN="sl1, work every st as it presents itself (three purls in a row at the decreases is expected), turn.";
const WSDEC="sl1, work to 2nd marker, sm, p2tog, work to 2 sts before 1st marker, ssp improved, sm, work until 1 st is left, k1, turn.";

function buildFlap(){
  const n={
    1:{t:"Set-up round: work 7, pm (1st marker), work 64, pm (2nd marker), work to end of round.",s:"164",side:"Round"},
    2:{t:"Work to 1 st before the 2nd marker, turn.",s:"partial row",side:"RS"},
    3:{t:"k2, p2, work in rib to 1 st before the 1st marker, turn. The 62 sts between the turning points are the flap.",s:"62 flap sts",side:"WS"}
  };
  for(let i=0;i<6;i++){
    n[4+i*2]={t:`Flap row 1 · repeat ${i+1} of 6. p2, work *k2, p2* to the turning point, turn.`,s:"62",side:"RS"};
    n[5+i*2]={t:`Flap row 2 · repeat ${i+1} of 6. Work *k2, p2* to 2 sts before the turning point, k2, turn.`,s:"62",side:"WS"};
  }
  return n;
}
function buildGusRound(){
  const n={
    1:{t:"Pick up 14 sts along the right edge of the flap. Work the flap: sl1, p1, *k2, p2* until 4 flap sts are left, k2, p1, sl1. Pick up 14 sts along the left edge, then *k2, p2* to end of round.",s:"192",side:"Round"},
    2:{t:"Full round. Work sts as they present; work picked-up sts in *k2, p2*, starting and ending with k2. You now have 4 knits in a row at each gusset.",s:"192",side:"Round"}
  };
  const seq=[1,0,1,0,1,1]; let s=192;
  for(let set=0;set<2;set++) seq.forEach((d,i)=>{
    const r=3+set*6+i; if(d) s-=2;
    n[r]={t:`Round ${i+1} of 6 · set ${set+1} of 2. ${d?DEC:PLAIN}`,s:String(s),side:"Round",shape:d};
  });
  n[14]={t:"Round 6 of 6 · set 2 of 2, plus back bind-off. Work with decreases to 6 sts past the 2nd marker. Swap the next 2 sts so the second crosses in front leaning right, k1 (7 sts past the 2nd marker on the right needle). With the 2.5 mm needle, bind off in pattern until 7 live sts remain before the 1st marker. Slide everything onto the left needle.",s:"90 live · 86 bound off",side:"Round",shape:1};
  return n;
}
function buildGusFlat(){
  const n={}, plan=[[RSDEC,"RS",1],[WSPLAIN,"WS",0],[RSDEC,"RS",1],[WSPLAIN,"WS",0],[RSDEC,"RS",1],[WSDEC,"WS",1],
                    [RSDEC,"RS",1],[WSPLAIN,"WS",0],[RSDEC,"RS",1],[WSPLAIN,"WS",0]];
  let s=90;
  plan.forEach(([t,side,d],i)=>{ if(d) s-=2;
    n[i+1]={t:`Row ${(i%6)+1}${i>=6?" (second pass, rows 1–4)":""}. ${t}`,s:String(s),side,shape:d}; });
  n[11]={t:"Neckline bind-off. sl1, work to the 1st marker and remove it, k1, p1, swap the next 2 sts (second crosses in front, leaning right), k1. You have 10 sts on the right needle; they stay live for the left strap. With the 2.5 mm needle, bind off in pattern until 10 sts remain at the end of the row.",s:"10 + 10 live · 58 bound off",side:"RS",shape:1};
  return n;
}
const STRAP="sl1, work sts as they present, knit the last st, turn.";

/* Sections in knitting order. start/end = extra steps before row 1 / after the last row. */
const SECTIONS=[
  {id:"band",name:"Underbust band",unit:"Round",rows:29,adjustable:1,
   start:{label:"Cast on",t:"Long-tail cast on 164 sts with the 3 mm needle. Join in the round and mark the start (left side seam).",s:"164"},
   every:{t:"*k2, p2* rib. Every round starts with the 2 purl sts.",s:"164",side:"Round"}},
  {id:"flap",name:"Front flap",unit:"Row",rows:15,notes:buildFlap(),
   end:{label:"Break yarn",t:"Break yarn. The flap's 62 sts and the rest of the round stay on the needle.",s:""}},
  {id:"gusround",name:"Gussets in the round",unit:"Round",rows:14,notes:buildGusRound(),
   start:{label:"Join yarn",t:"Hold the work RS out and join new yarn at the right edge of the flap.",s:""},
   end:{label:"Needle change",t:"Pick the 3 mm needles back up. From here you work back and forth on 90 sts.",s:"90"}},
  {id:"gusflat",name:"Gussets flat",unit:"Row",rows:11,notes:buildGusFlat()},
  {id:"rstrap",name:"Right strap",unit:"Row",rows:108,adjustable:1,
   every:{t:STRAP,s:"10"},notes:{80:{t:"About 22 cm. Good moment to try it on and check the length you need.",s:"10"}},
   end:{label:"Bind off",t:"Bind off the right strap once the length is right.",s:""}},
  {id:"lstrap",name:"Left strap",unit:"Row",rows:108,adjustable:1,matchTo:"rstrap",
   start:{label:"Join yarn",t:"WS facing, join new yarn to the 10 held sts at the start of the neckline.",s:"10"},
   every:{t:STRAP,s:"10"},
   end:{label:"Bind off",t:"Bind off the left strap at the same length as the right one.",s:""}},
  {id:"finish",name:"Finishing",unit:"Step",checklist:[
   ["Attach","Attach the straps to the back. Try it on to place them."],
   ["Ends","Weave in all ends."],
   ["Block","Block. Lay the ribbing bars close together and don't let it stretch."]]},
];

/* ---------- state ---------- */
let state={step:0,targets:{},updatedAt:0};
try{ const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s&&typeof s.step==="number") state=Object.assign(state,s);}catch(e){}
let docRef=null, pending=false, writing=false, timer=null, syncMsg="Saved on this device", syncOk=false, confirmReset=false;

const rowsOf = sec => sec.checklist ? sec.checklist.length : (state.targets[sec.id] ?? sec.rows);

function buildSteps(){
  const out=[];
  SECTIONS.forEach(sec=>{
    if(sec.checklist){ sec.checklist.forEach(([lab,t],i)=>out.push({sec,r:i+1,label:lab,t,s:""})); return; }
    if(sec.start) out.push({sec,r:0,label:sec.start.label,t:sec.start.t,s:sec.start.s});
    const n=rowsOf(sec);
    for(let r=1;r<=n;r++){
      const x=(sec.notes&&sec.notes[r])||sec.every;
      out.push({sec,r,label:sec.unit+" "+r,t:x.t,s:x.s,side:x.side||"",shape:!!x.shape});
    }
    if(sec.end) out.push({sec,r:n+1,label:sec.end.label,t:sec.end.t,s:sec.end.s});
  });
  out.push({sec:null,r:0,label:"Done",t:"Your Fausta bralette is finished.",s:""});
  return out;
}
let STEPS=buildSteps();
const clampStep=()=>{ state.step=Math.max(0,Math.min(STEPS.length-1,state.step)); };
clampStep();

function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
  if(!docRef) return;
  pending=true; clearTimeout(timer); timer=setTimeout(flush,700); setSync("Saving…",false);
}
async function flush(){
  if(writing||!docRef) return; writing=true; pending=false;
  const body=JSON.parse(JSON.stringify(state));
  try{ await docRef.set(body); setSync("Synced",true); }
  catch(e){ if(e&&e.code==="unavailable"){ try{ await docRef.set(body); setSync("Synced",true);}catch(_){ setSync("Offline · saved on this device",false);} } else setSync("Couldn't sync · saved on this device",false); }
  writing=false; if(pending) flush();
}
function setSync(t,ok){ syncMsg=t; syncOk=ok; const el=document.getElementById("sync"); if(el){ el.className="sync"+(ok?" ok":""); el.lastChild.textContent=" "+t; } }

/* ---------- view ---------- */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cm=r=>(r/RPC).toFixed(1);
const firstIdx=id=>STEPS.findIndex(x=>x.sec&&x.sec.id===id);
const lastIdx=id=>{ let i=-1; STEPS.forEach((x,j)=>{ if(x.sec&&x.sec.id===id) i=j; }); return i; };

function schematic(active){
  const zones={
    band:["30,138 170,138 170,110 30,110"], flap:["72,110 128,110 128,82 72,82"],
    gusround:["30,110 72,110 72,82 34,82","128,110 170,110 166,82 128,82"],
    gusflat:["34,82 166,82 156,56 44,56"], rstrap:["44,56 56,56 60,8 50,8"], lstrap:["144,56 156,56 150,8 140,8"]
  };
  return `<svg class="schem" viewBox="24 2 152 140" aria-hidden="true">${Object.entries(zones).map(([k,segs])=>{
    const cls=k===active?" on":(lastIdx(k)<state.step?" full":"");
    return segs.map(p=>`<polygon class="z${cls}" points="${p}"/>`).join("");
  }).join("")}</svg>`;
}

function render(keepScroll){
  const st=STEPS[state.step], sec=st.sec, last=STEPS.length-1;
  const pct=Math.round(state.step/last*100);
  const n=sec?rowsOf(sec):0;
  let big, of;
  if(!sec){ big="✓"; of="all done"; }
  else if(sec.checklist){ big=st.r; of=`of ${n}`; }
  else if(st.r===0){ big="·"; of="before row 1"; }
  else if(st.r>n){ big="✓"; of=`${n} ${sec.unit.toLowerCase()}s`; }
  else { big=st.r; of=`of ${n}${sec.adjustable?` · ≈${cm(st.r)} cm`:""}`; }
  const side=st.side?(st.side==="Round"?"Round · RS":st.side):"";
  let matchInfo="";
  if(sec&&sec.matchTo){ const m=SECTIONS.find(x=>x.id===sec.matchTo); matchInfo=`Right strap: ${rowsOf(m)} rows`; }

  let list="", cur=null;
  STEPS.forEach((x,i)=>{
    if(x.sec!==cur){
      cur=x.sec;
      if(cur){ const done=lastIdx(cur.id)<state.step, c=rowsOf(cur);
        list+=`<div class="sect${done?" done":""}" id="s-${cur.id}"><h2>${esc(cur.name)}</h2><span class="mono">${cur.checklist?c+" steps":c+" "+cur.unit.toLowerCase()+"s"}${cur.adjustable?" · ≈"+cm(c)+" cm":""}</span></div>`; }
    }
    if(!x.sec) return;
    const cls=["row"]; if(i<state.step) cls.push("past"); if(i===state.step) cls.push("cur"); if(x.shape) cls.push("shape");
    const rn=x.sec.checklist?"☐":(x.r===0||x.r>rowsOf(x.sec))?"—":x.r;
    list+=`<button class="${cls.join(" ")}" data-i="${i}"><span class="rn">${rn}</span><span class="rt">${x.sec.checklist||x.r===0||x.r>rowsOf(x.sec)?"<b>"+esc(x.label)+".</b> ":""}${esc(x.t)}</span><span class="rs">${esc(x.s)}</span></button>`;
  });

  app.innerHTML=`
  <div class="head">${schematic(sec&&sec.id)}
    <div style="min-width:0"><h1>Fausta bralette</h1><div class="sec">${sec?esc(sec.name):"Finished"} · size 1A</div></div>
    <div class="pct">${pct}%</div>
    <div class="bar"><span style="width:${pct}%"></span></div></div>
  <div class="counter">
    <button class="minus" id="minus" aria-label="Previous step" ${state.step===0?"disabled":""}>−</button>
    <div class="readout"><div class="n">${big}</div><div class="of">${of}</div>${side?`<span class="side">${esc(side)}</span>`:""}</div>
    <button class="plus" id="plus" aria-label="Next step" ${state.step===last?"disabled":""}>+</button>
  </div>
  <div class="now${st.shape?" shape":""}"><div class="eyebrow">${sec?esc(sec.name)+" · ":""}${esc(st.label)}${st.shape?" · shaping":""}</div>
    <p>${esc(st.t)}</p>${st.s?`<div class="sts">Sts after: <b>${esc(st.s)}</b></div>`:""}</div>
  ${sec&&sec.adjustable?`<div class="tgt"><span>${matchInfo?esc(matchInfo):"Target length"}</span><span class="ctl">
    <button id="tdown" aria-label="Fewer rows">−</button><span class="mono">${n}</span><button id="tup" aria-label="More rows">+</button></span></div>`:""}
  <div class="meta"><span><b>Yarn</b> 100 g Merinocot</span><span><b>Needles</b> 3 mm, 2.5 mm for bind-offs</span><span><b>Gauge</b> 42 sts × 36 rnds = 10 cm</span>${docRef?`<span class="sync${syncOk?" ok":""}" id="sync"><i></i> ${esc(syncMsg)}</span>`:""}</div>
  <div class="list">${list}</div>
  <div class="foot">${confirmReset?`<span style="color:var(--muted)">Start over from cast on?</span><button id="rno">Keep</button><button class="danger" id="ryes">Reset</button>`:`<button id="reset">Reset progress</button>`}</div>
  <p class="credit">Pattern by Simona Taraškevičiūtė (lowkey.bold.knit). The photographed sample is size 2B.</p>`;
  if(!keepScroll){ const el=app.querySelector(".row.cur"); if(el) el.scrollIntoView({block:"nearest"}); }
}

function go(i){ const v=Math.max(0,Math.min(STEPS.length-1,i)); if(v===state.step) return; state.step=v; save(); render(true); }
function setTarget(sec,d){
  const before=STEPS[state.step];
  state.targets[sec.id]=Math.max(1,rowsOf(sec)+d);
  STEPS=buildSteps();
  let i=STEPS.findIndex(x=>x.sec===before.sec&&x.r===before.r);
  if(i<0) i=lastIdx(sec.id);
  state.step=i; clampStep(); save(); render(true);
}

app.addEventListener("click",e=>{
  wake();
  const r=e.target.closest("[data-i]"); if(r){ go(+r.dataset.i); return; }
  const t=e.target.closest("button"); if(!t||t.disabled) return;
  const sec=STEPS[state.step].sec;
  if(t.id==="plus") go(state.step+1);
  else if(t.id==="minus") go(state.step-1);
  else if(t.id==="tup"&&sec) setTarget(sec,2);
  else if(t.id==="tdown"&&sec) setTarget(sec,-2);
  else if(t.id==="reset"){ confirmReset=true; render(true); }
  else if(t.id==="rno"){ confirmReset=false; render(true); }
  else if(t.id==="ryes"){ confirmReset=false; state={step:0,targets:{},updatedAt:0}; STEPS=buildSteps(); save(); render(); window.scrollTo(0,0); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="+"||e.key==="="||e.key==="ArrowRight"){ go(state.step+1); e.preventDefault(); }
  if(e.key==="-"||e.key==="ArrowLeft"){ go(state.step-1); e.preventDefault(); }
});

let lock=null;
async function wake(){ try{ if(!lock&&navigator.wakeLock&&document.visibilityState==="visible"){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null);} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake(); });

render();

(async()=>{
  try{
    const db=window.claude&&await window.claude.use("db");
    if(!db) return;
    docRef=db.doc("progress/"+SLUG);
    setSync("Synced",true);
    docRef.onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      if(d&&typeof d.step==="number"&&(d.updatedAt||0)>state.updatedAt&&!pending&&!writing){
        state={step:d.step,targets:Object.assign({},d.targets||{}),updatedAt:d.updatedAt||0};
        STEPS=buildSteps(); clampStep();
        try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
        if(!confirmReset) render();
      } else if(state.updatedAt&&(!d||typeof d.step!=="number"||(d.updatedAt||0)<state.updatedAt)&&!pending){ save(); }
    },()=>setSync("Offline · saved on this device",false));
  }catch(e){}
})();
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
